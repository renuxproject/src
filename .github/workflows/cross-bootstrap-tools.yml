name: Cross-build Kernel

on:
  push:
    branches: [ main, 'stable/[1-9][10]' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: amd64 ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: amd64
            target: amd64
            os: macos-latest
            compiler: clang
            pkgs: bmake libarchive
    steps:
      - uses: actions/checkout@v4

      - name: install packages (macOS)
        run: |
          brew update --quiet || true
          brew install ${{ matrix.pkgs }} lua || true

      - name: create environment
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          mkdir -p ../build
          echo "MAKEOBJDIRPREFIX=${PWD%/*}/build" >> $GITHUB_ENV
          echo "NPROC=`getconf _NPROCESSORS_ONLN 2>/dev/null || getconf NPROCESSORS_ONLN 2>/dev/null || echo 1`" >> $GITHUB_ENV

      - name: make kernel-toolchain
        run: |
          ./renux tools -m ${{ matrix.target }} -a ${{ matrix.target_arch }} -- --debug -s -j$NPROC -DWITH_DISK_IMAGE_TOOLS_BOOTSTRAP

      - name: make buildkernel
        run: |
          ./renux kernels -m ${{ matrix.target }} -a ${{ matrix.target_arch }} -- --debug -s -j$NPROC NO_MODULES=yes
