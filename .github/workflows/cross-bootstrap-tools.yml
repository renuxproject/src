name: Cross-build Kernel

on:
  push:
    branches: [ main, 'stable/[1-9][10]' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target_arch }} ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: amd64
            target: amd64
            os: ubuntu-24.04
            compiler: clang-18
            cross-bindir: /usr/lib/llvm-18/bin
            pkgs: bmake libarchive-dev clang-18 lld-18
          - target_arch: amd64
            target: amd64
            os: macos-latest
            compiler: clang
            pkgs: bmake libarchive
    steps:
      - uses: actions/checkout@v4

      - name: install packages (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --quiet || true
          sudo apt-get -yq --no-install-suggests --no-install-recommends install \
            ${{ matrix.pkgs }} lua5.4

      - name: install packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update --quiet || true
          brew install ${{ matrix.pkgs }} lua || true

      - name: create environment
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          mkdir -p ../build
          echo "MAKEOBJDIRPREFIX=${PWD%/*}/build" >> $GITHUB_ENV
          echo "NPROC=`getconf _NPROCESSORS_ONLN 2>/dev/null || getconf NPROCESSORS_ONLN 2>/dev/null || echo 1`" >> $GITHUB_ENV

      - name: make kernel-toolchain
        run: |
          EXTRA=""
          if [ -n "${{ matrix.cross-bindir }}" ]; then EXTRA="$EXTRA --cross-bindir=${{ matrix.cross-bindir }}"; fi
          if [ -n "${{ matrix.cross-toolchain }}" ]; then EXTRA="$EXTRA --cross-toolchain=${{ matrix.cross-toolchain }}"; fi
          ./renux tools -m ${{ matrix.target }} -a ${{ matrix.target_arch }} -- --debug -s -j$NPROC -DWITH_DISK_IMAGE_TOOLS_BOOTSTRAP $EXTRA

      - name: make buildkernel
        run: |
          EXTRA=""
          if [ -n "${{ matrix.cross-bindir }}" ]; then EXTRA="$EXTRA --cross-bindir=${{ matrix.cross-bindir }}"; fi
          if [ -n "${{ matrix.cross-toolchain }}" ]; then EXTRA="$EXTRA --cross-toolchain=${{ matrix.cross-toolchain }}"; fi
          ./renux kernels -m ${{ matrix.target }} -a ${{ matrix.target_arch }} -- --debug -s -j$NPROC NO_MODULES=yes $EXTRA
