name: Build Renux ISO (FreeBSD VM)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Leave empty for a snapshot release.'
        required: false
        default: ''
      include-world:
        description: 'Also build the full userland (buildworld). Slow. The ISO itself only needs the kernel.'
        required: false
        default: false
        type: boolean
      publish:
        description: 'Publish a GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-iso-fbsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Renux ISO (native FreeBSD)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Keep the build objects and ccache inside the workspace so the VM syncs
      # them back and actions/cache can persist them between runs.
      MAKEOBJDIRPREFIX: ${{ github.workspace }}/build
      CCACHE_DIR: ${{ github.workspace }}/ccache
      MK_CCACHE_BUILD: yes
      CCACHE_BIN: /usr/local/bin/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: renux-ccache-fbsd-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            renux-ccache-fbsd-${{ runner.os }}-

      - name: Build Renux in FreeBSD VM
        id: build
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          mem: 6144
          envs: 'MAKEOBJDIRPREFIX CCACHE_DIR MK_CCACHE_BUILD CCACHE_BIN CCACHE_BASEDIR CCACHE_MAXSIZE CCACHE_COMPRESS'
          cache-after-prepare: true
          prepare: |
            pkg install -y python3 xorriso ccache
          run: |
            if [ "${{ inputs.include-world }}" = "true" ]; then
              TARGETS="build iso"
            else
              TARGETS="iso"
            fi
            ./build.sh -j$(sysctl -n hw.ncpu) -I out $TARGETS

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: renux-ccache-fbsd-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}

      - name: List artifacts
        run: ls -lh out/

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renux-iso
          path: |
            out/renux-uefi.iso
            out/renux-bios.iso
            out/renux-uefi.img
          if-no-files-found: error

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "value=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=snapshot-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.value }}" \
            out/renux-uefi.iso out/renux-bios.iso out/renux-uefi.img \
            --repo "$GITHUB_REPOSITORY" \
            --title "Renux ${{ steps.tag.outputs.value }}" \
            --generate-notes
