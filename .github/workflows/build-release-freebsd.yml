name: Build Renux ISO (FreeBSD VM)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Leave empty for a snapshot release.'
        required: false
        default: ''
      include-world:
        description: 'Also build the full userland (buildworld). Slow. The ISO itself only needs the kernel.'
        required: false
        default: false
        type: boolean
      world-image:
        description: 'Install the full world INTO the ISO (build worldiso). Very slow (~2h+), produces a large live ISO.'
        required: false
        default: false
        type: boolean
      publish:
        description: 'Publish a GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-iso-fbsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Renux ISO (native FreeBSD)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Keep the build objects and ccache inside the workspace so the VM syncs
      # them back and actions/cache can persist them between runs.
      MAKEOBJDIRPREFIX: ${{ github.workspace }}/build
      CCACHE_DIR: ${{ github.workspace }}/ccache
      MK_CCACHE_BUILD: yes
      CCACHE_BIN: /usr/local/bin/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: renux-ccache-fbsd-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            renux-ccache-fbsd-${{ runner.os }}-

      - name: Build Renux in FreeBSD VM
        id: build
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          mem: 6144
          envs: 'MAKEOBJDIRPREFIX CCACHE_DIR MK_CCACHE_BUILD CCACHE_BIN CCACHE_BASEDIR CCACHE_MAXSIZE CCACHE_COMPRESS'
          cache-after-prepare: true
          prepare: |
            pkg install -y python3 xorriso ccache
          run: |
            if [ "${{ inputs.world-image }}" = "true" ]; then
              TARGETS="build worldiso"
            elif [ "${{ inputs.include-world }}" = "true" ]; then
              TARGETS="build iso"
            else
              TARGETS="iso"
            fi
            ./build.sh -j$(sysctl -n hw.ncpu) -I out $TARGETS

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: renux-ccache-fbsd-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}

      - name: List artifacts
        run: ls -lh out/

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renux-iso
          path: |
            out/renux-installer.iso
            out/renux-installer.iso.xz
          if-no-files-found: warn

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "value=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=snapshot-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=""
          for f in out/renux-installer.iso out/renux-installer.iso.xz; do
            if [ -f "$f" ]; then
              # GitHub caps release assets at 2 GiB; skip oversized ones.
              if [ "$(stat -c %s "$f" 2>/dev/null || stat -f %z "$f")" -ge 2147483648 ]; then
                echo "::warning::$f exceeds GitHub's 2 GiB release asset limit; skipping upload"
              else
                FILES="$FILES $f"
              fi
            fi
          done
          {
            printf '%s\n' "EXPERIMENTAL - NOT a stable release of Renux."
            printf '%s\n' ""
            printf '%s\n' "Renux is under constant development. This build is provided for testing:"
            printf '%s\n' "it may have bugs, missing features and frequent changes. Do not use it on"
            printf '%s\n' "production or important machines."
            printf '%s\n' ""
            printf '%s\n' "- Stable target: amd64 (x86-64). Other architectures under sys/arch/ are experimental."
            printf '%s\n' "- The live image and installer (renuxinstaller) are still being hardened."
            printf '%s\n' ""
            printf '%s\n' "Renux is community-driven and decentralized; forks and independent efforts are welcome."
            printf '%s\n' "See DECENTRALIZATION.md. Website: https://renuxproject.github.io"
          } > release-notes.md
          # gh release create can hit transient GitHub errors (5xx); retry.
          for attempt in 1 2 3 4 5; do
            if gh release create "${{ steps.tag.outputs.value }}" $FILES \
                --repo "$GITHUB_REPOSITORY" \
                --title "Renux ${{ steps.tag.outputs.value }}" \
                --prerelease \
                --notes-file release-notes.md; then
              exit 0
            fi
            echo "release create attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          exit 1
