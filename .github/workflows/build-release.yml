name: Build Renux ISO (Linux cross-build, manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Leave empty for a snapshot release.'
        required: false
        default: ''
      include-world:
        description: 'Also build the full userland (buildworld). Slow: ~2h. The ISO itself only needs the kernel.'
        required: false
        default: false
        type: boolean
      publish:
        description: 'Publish a GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Renux ISO (buildworld + buildkernel)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (clang toolchain)
        run: |
          sudo apt-get update --quiet || true
          sudo apt-get -yq --no-install-suggests --no-install-recommends install \
            bmake libarchive-dev clang-18 lld-18 dosfstools mtools xorriso
          # Make clang/lld the default compilers so build.sh and make.py
          # cross-build with clang instead of gcc.
          sudo ln -sf "$(command -v clang-18)"     /usr/local/bin/clang
          sudo ln -sf "$(command -v clang++-18)"   /usr/local/bin/clang++
          sudo ln -sf "$(command -v clang-cpp-18)" /usr/local/bin/clang-cpp
          sudo ln -sf "$(command -v ld.lld-18)"    /usr/local/bin/ld.lld
          clang --version | head -1

      - name: Create build environment
        run: |
          mkdir -p ../build
          echo "MAKEOBJDIRPREFIX=${PWD%/*}/build" >> "$GITHUB_ENV"
          echo "NPROC=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 2)" >> "$GITHUB_ENV"
          # Use clang for the host bootstrap tools too (not just the cross toolchain).
          echo "CC=clang"      >> "$GITHUB_ENV"
          echo "CXX=clang++"   >> "$GITHUB_ENV"
          echo "CPP=clang-cpp" >> "$GITHUB_ENV"

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MAKEOBJDIRPREFIX }}
          # Exact match only on re-runs of the same commit; otherwise fall back
          # to the most recent build so buildworld resumes incrementally
          # (WITHOUT_CLEAN is used by build.sh/make.py).
          key: renux-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            renux-build-${{ runner.os }}-

      - name: Build kernel and bootable ISO images
        run: |
          set -o pipefail
          if [ "${{ inputs.include-world }}" = "true" ]; then
            echo "::notice::Full build with buildworld enabled (~2h)"
            TARGETS="build iso"
          else
            echo "::notice::Kernel-only build (buildworld skipped) ~30min"
            TARGETS="iso"
          fi
          for attempt in 1 2 3 4; do
            echo "::group::build attempt ${attempt}"
            if ./build.sh -j "$NPROC" -I release $TARGETS; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt ${attempt} failed; retrying"
          done
          echo "build failed after 4 attempts"
          exit 1

      - name: List artifacts
        run: ls -lh release/

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renux-iso
          path: |
            release/renux-uefi.iso
            release/renux-bios.iso
            release/renux-uefi.img
          if-no-files-found: error

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "value=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=snapshot-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.value }}" \
            release/renux-uefi.iso release/renux-bios.iso release/renux-uefi.img \
            --repo "$GITHUB_REPOSITORY" \
            --title "Renux ${{ steps.tag.outputs.value }}" \
            --generate-notes
