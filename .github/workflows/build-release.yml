name: Build Renux ISO (Linux cross-build, manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Leave empty for a snapshot release.'
        required: false
        default: ''
      include-world:
        description: 'Also build the full userland (buildworld). Slow: ~2h. The ISO itself only needs the kernel.'
        required: false
        default: false
        type: boolean
      world-image:
        description: 'Install the full world INTO the ISO (build worldiso). Very slow (~2h+), produces a large live ISO.'
        required: false
        default: false
        type: boolean
      publish:
        description: 'Publish a GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Renux ISO (buildworld + buildkernel)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (clang toolchain)
        run: |
          sudo apt-get update --quiet || true
          sudo apt-get -yq --no-install-suggests --no-install-recommends install \
            bmake libarchive-dev clang-18 lld-18 dosfstools mtools xorriso ccache \
            lua5.4 xz-utils
          # Make clang/lld the default compilers so build.sh and make.py
          # cross-build with clang instead of gcc.
          sudo ln -sf "$(command -v clang-18)"     /usr/local/bin/clang
          sudo ln -sf "$(command -v clang++-18)"   /usr/local/bin/clang++
          sudo ln -sf "$(command -v clang-cpp-18)" /usr/local/bin/clang-cpp
          sudo ln -sf "$(command -v ld.lld-18)"    /usr/local/bin/ld.lld
          # The loader/host build (stand/) looks for the linker in /usr/bin.
          sudo ln -sf "$(command -v clang-18)"     /usr/bin/clang
          sudo ln -sf "$(command -v clang++-18)"   /usr/bin/clang++
          sudo ln -sf "$(command -v clang-cpp-18)" /usr/bin/clang-cpp
          sudo ln -sf "$(command -v ld.lld-18)"    /usr/bin/ld.lld
          clang --version | head -1

      - name: Create build environment
        run: |
          mkdir -p ../build
          echo "MAKEOBJDIRPREFIX=${PWD%/*}/build" >> "$GITHUB_ENV"
          echo "NPROC=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 2)" >> "$GITHUB_ENV"
          # Use clang for the host bootstrap tools too (not just the cross toolchain).
          echo "CC=clang"      >> "$GITHUB_ENV"
          echo "CXX=clang++"   >> "$GITHUB_ENV"
          echo "CPP=clang-cpp" >> "$GITHUB_ENV"
          # Enable ccache (caches compiler output by content, so it works across
          # runs even though file mtimes reset on every ephemeral runner).
          echo "MK_CCACHE_BUILD=yes" >> "$GITHUB_ENV"
          echo "CCACHE_BIN=/usr/bin/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${PWD%/*}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${PWD}" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: renux-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            renux-ccache-${{ runner.os }}-

      - name: Build kernel and bootable ISO images
        run: |
          set -o pipefail
          if [ "${{ inputs.world-image }}" = "true" ]; then
            echo "::notice::World ISO enabled (build worldiso) ~2h+"
            TARGETS="build worldiso"
          elif [ "${{ inputs.include-world }}" = "true" ]; then
            echo "::notice::Full build with buildworld enabled (~2h)"
            TARGETS="build iso"
          else
            echo "::notice::Kernel-only build (buildworld skipped) ~30min"
            TARGETS="iso"
          fi
          for attempt in 1 2 3 4; do
            echo "::group::build attempt ${attempt}"
            # Run as root so installworld -U produces root-owned files in the
            # world root (the cross-build install wrapper can't set -o/-g).
            if sudo -E ./build.sh -j "$NPROC" -I release $TARGETS; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt ${attempt} failed; retrying"
          done
          echo "build failed after 4 attempts"
          exit 1

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # run_id makes the key unique per run so the save never collides
          # with an earlier cache of the same commit.
          key: renux-ccache-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}

      - name: List artifacts
        run: ls -lh release/

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renux-iso
          path: |
            release/renux-installer.iso
            release/renux-installer.iso.xz
          if-no-files-found: warn

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "value=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=snapshot-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=""
          for f in release/renux-installer.iso release/renux-installer.iso.xz; do
            if [ -f "$f" ]; then
              # GitHub caps release assets at 2 GiB; skip oversized ones.
              if [ "$(stat -c %s "$f" 2>/dev/null || stat -f %z "$f")" -ge 2147483648 ]; then
                echo "::warning::$f exceeds GitHub's 2 GiB release asset limit; skipping upload"
              else
                FILES="$FILES $f"
              fi
            fi
          done
          {
            printf '%s\n' "EXPERIMENTAL - NOT a stable release of Renux."
            printf '%s\n' ""
            printf '%s\n' "Renux is under constant development. This build is provided for testing:"
            printf '%s\n' "it may have bugs, missing features and frequent changes. Do not use it on"
            printf '%s\n' "production or important machines."
            printf '%s\n' ""
            printf '%s\n' "- Stable target: amd64 (x86-64). Other architectures under sys/arch/ are experimental."
            printf '%s\n' "- The live image and installer (renuxinstaller) are still being hardened."
            printf '%s\n' ""
            printf '%s\n' "Renux is community-driven and decentralized; forks and independent efforts are welcome."
            printf '%s\n' "See DECENTRALIZATION.md. Website: https://renuxproject.github.io"
          } > release-notes.md
          gh release create "${{ steps.tag.outputs.value }}" $FILES \
            --repo "$GITHUB_REPOSITORY" \
            --title "Renux ${{ steps.tag.outputs.value }}" \
            --prerelease \
            --notes-file release-notes.md
