name: Build Renux ISO (macOS cross-build)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Leave empty for a snapshot release.'
        required: false
        default: ''
      include-world:
        description: 'Also build the full userland (buildworld). Slow: ~2h. The ISO itself only needs the kernel.'
        required: false
        default: false
        type: boolean
      world-image:
        description: 'Install the full world INTO the ISO (build worldiso). Very slow (~2h+), produces a large live ISO.'
        required: false
        default: false
        type: boolean
      publish:
        description: 'Publish a GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Renux ISO (macOS cross-build)
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: /Users/runner/Library/Caches/Homebrew
          key: renux-brew-${{ runner.os }}-v1
          restore-keys: |
            renux-brew-${{ runner.os }}-

      - name: Install build dependencies (Homebrew)
        run: |
          brew update --quiet || true
          brew install --quiet bmake libarchive llvm lld lua xorriso \
            dosfstools mtools ccache xz coreutils || true

      - name: Create build environment
        run: |
          BREW_PREFIX="$(brew --prefix)"
          echo "PATH=${BREW_PREFIX}/opt/llvm/bin:${BREW_PREFIX}/bin:/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"
          mkdir -p ../build
          echo "MAKEOBJDIRPREFIX=${PWD%/*}/build" >> "$GITHUB_ENV"
          echo "NPROC=$(getconf _NPROCESSORS_ONLN 2>/dev/null || getconf NPROCESSORS_ONLN 2>/dev/null || echo 2)" >> "$GITHUB_ENV"
          echo "CC=clang"      >> "$GITHUB_ENV"
          echo "CXX=clang++"   >> "$GITHUB_ENV"
          echo "CPP=clang-cpp" >> "$GITHUB_ENV"
          echo "MK_CCACHE_BUILD=yes" >> "$GITHUB_ENV"
          echo "CCACHE_BIN=${BREW_PREFIX}/bin/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${PWD%/*}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${PWD}" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"
          clang --version | head -1

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: renux-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            renux-ccache-${{ runner.os }}-

      - name: Build kernel and bootable ISO images
        run: |
          set -o pipefail
          if [ "${{ inputs.world-image }}" = "true" ]; then
            echo "::notice::World ISO enabled (build worldiso) ~2h+"
            TARGETS="build worldiso"
          elif [ "${{ inputs.include-world }}" = "true" ]; then
            echo "::notice::Full build with buildworld enabled (~2h)"
            TARGETS="build iso"
          else
            echo "::notice::Kernel-only build (buildworld skipped) ~30min"
            TARGETS="iso"
          fi
          for attempt in 1 2 3 4; do
            echo "::group::build attempt ${attempt}"
            if sudo -E ./renux -j "$NPROC" -I release $TARGETS; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt ${attempt} failed; retrying"
          done
          echo "build failed after 4 attempts"
          exit 1

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: renux-ccache-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}

      - name: List artifacts
        run: ls -lh release/

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renux-iso
          path: |
            release/renux-installer.iso
            release/renux-installer.iso.xz
          if-no-files-found: warn

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "value=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=snapshot-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=""
          for f in release/renux-installer.iso release/renux-installer.iso.xz; do
            if [ -f "$f" ]; then
              if [ "$(stat -f %z "$f" 2>/dev/null || stat -c %s "$f")" -ge 2147483648 ]; then
                echo "::warning::$f exceeds GitHub's 2 GiB release asset limit; skipping upload"
              else
                FILES="$FILES $f"
              fi
            fi
          done
          {
            printf '%s\n' "EXPERIMENTAL - NOT a stable release of Renux."
            printf '%s\n' ""
            printf '%s\n' "Renux is under constant development. This build is provided for testing:"
            printf '%s\n' "it may have bugs, missing features and frequent changes. Do not use it on"
            printf '%s\n' "production or important machines."
            printf '%s\n' ""
            printf '%s\n' "- Stable target: amd64 (x86-64). Other architectures under sys/arch/ are experimental."
            printf '%s\n' "- The live image and installer (renuxinstaller) are still being hardened."
            printf '%s\n' ""
            printf '%s\n' "Renux is community-driven and decentralized; forks and independent efforts are welcome."
            printf '%s\n' "See DECENTRALIZATION.md. Website: https://renuxproject.github.io"
          } > release-notes.md
          for attempt in 1 2 3 4 5; do
            if gh release create "${{ steps.tag.outputs.value }}" $FILES \
                --repo "$GITHUB_REPOSITORY" \
                --title "Renux ${{ steps.tag.outputs.value }}" \
                --prerelease \
                --notes-file release-notes.md; then
              exit 0
            fi
            echo "release create attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          exit 1
